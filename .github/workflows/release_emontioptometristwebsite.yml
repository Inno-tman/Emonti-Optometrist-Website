# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - EmontiOptometristWebsite

on:
  push:
    branches:
      - Release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      - name: Restore NuGet packages
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: nuget restore ..\Emonti-Optometrist-Website.sln

      - name: Build and publish to folder
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: |
          $pub = "$env:GITHUB_WORKSPACE\published"
          msbuild Emonti-Optometrist-Website.csproj /nologo /verbosity:m /t:Build /p:Configuration=Release /p:OutDir="$pub\bin\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          robocopy . $pub /S /IS /XF *.cs *.csproj *.user *.sln *.docx *.doc *.mdf *.ldf /XD obj packages Properties .vs App_Data bin /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 4) { exit $LASTEXITCODE } else { $global:LASTEXITCODE = 0 }
          Write-Host "Removing unnecessary large files from published output..."
          # Keep roslyn - needed by DotNetCompilerPlatform for runtime compilation of ASPX files
          Remove-Item -Recurse -Force "$pub\bin\_PublishedWebsites" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$pub\bin\*.xml" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$pub\bin\*.pdb" -ErrorAction SilentlyContinue

      - name: Verify and measure published output
        run: |
          if (-Not (Test-Path "$env:GITHUB_WORKSPACE\published")) {
            Write-Error "Published folder not found"
            Get-ChildItem "$env:GITHUB_WORKSPACE" | Select-Object Name
            exit 1
          }
          $files = Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\published"
          $totalSize = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host "Published $($files.Count) files, $([Math]::Round($totalSize/1MB, 2)) MB total"
          Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\published" | Sort-Object Length -Descending | Select-Object -First 15 FullName, Length
          $configFile = Get-ChildItem "$env:GITHUB_WORKSPACE\published" -Filter "*.config" -Recurse | Select-Object -ExpandProperty Name
          Write-Host "Config files found: $($configFile -join ', ')"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\published\Web.config")) {
            Write-Error "Web.config NOT FOUND in published output!"
            Get-ChildItem "$env:GITHUB_WORKSPACE\published" -Filter "*.config"
            exit 1
          }
          if ($files.Count -eq 0) { exit 1 }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/**

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: publish
      
      - name: List publish contents
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish" | Select-Object Name, Length, Mode
          Write-Host "---"
          Get-ChildItem "$env:GITHUB_WORKSPACE\publish" -Filter "*.config" -Recurse | Select-Object FullName, Length
      
      - name: Deploy via FTPS + .NET server-side extraction
        shell: pwsh
        run: |
          $scmUrl = "https://emontioptometristwebsite-g6gjdgc2hsf7ghht.scm.southafricanorth-01.azurewebsites.net"
          $credentials = "$($env:AZURE_KUDU_USERNAME):$($env:AZURE_KUDU_PASSWORD)"
          $encodedCreds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          $headers = @{Authorization = "Basic $encodedCreds"}
          # Upload zip via FTPS
          $zipPath = "$env:RUNNER_TEMP\deploy.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath $zipPath -Force
          $ftpUrl = "ftps://waws-prod-jnb21-011.ftp.azurewebsites.windows.net/site/wwwroot/deploy.zip"
          $ftpUser = "EmontiOptometristWebsite" + [char]92 + '$EmontiOptometristWebsite'
          $ftpPass = $env:AZURE_KUDU_PASSWORD
          Write-Host "Uploading $((Get-Item $zipPath).Length) bytes via FTPS..."
          curl.exe -T "$zipPath" "$ftpUrl" --user "${ftpUser}:${ftpPass}" --ssl --insecure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "FTPS upload complete."
          # Extract via .NET (Expand-Archive fails in Kudu sandbox - no console handle)
          $extractCmd = 'Add-Type -AssemblyName System.IO.Compression.FileSystem; Get-ChildItem D:\home\site\wwwroot -Exclude deploy.zip,app_offline.htm | Remove-Item -Recurse -Force; [System.IO.Compression.ZipFile]::ExtractToDirectory(''D:\home\site\wwwroot\deploy.zip'', ''D:\home\site\wwwroot''); Write-Output ''Extraction OK'''
          $body = @{command = $extractCmd; dir = 'site\wwwroot'} | ConvertTo-Json
          for ($i = 0; $i -lt 3; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "$scmUrl/api/command" -Method POST -Body $body -ContentType "application/json" -Headers $headers -UseBasicParsing
              $rjson = $r.Content | ConvertFrom-Json
              if ($rjson.ExitCode -eq 0 -and $rjson.Output -match 'Extraction OK') { Write-Host 'Extraction succeeded'; break }
              else { Write-Host "Extraction issue (exit $($rjson.ExitCode)): $($rjson.Error)"; Start-Sleep -Seconds 5 }
            } catch { Write-Host "Retry $i after 503..."; Start-Sleep -Seconds 10 }
          }
          # Clean up
          try { Invoke-WebRequest -Uri "$scmUrl/api/vfs/site/wwwroot/deploy.zip" -Method DELETE -Headers $headers -UseBasicParsing } catch {}
          try { Invoke-WebRequest -Uri "$scmUrl/api/vfs/site/wwwroot/app_offline.htm" -Method DELETE -Headers $headers -UseBasicParsing } catch {}
          # Verify deployment
          Start-Sleep -Seconds 5
          try {
            $check = Invoke-WebRequest -Uri "$scmUrl/api/vfs/site/wwwroot/Web.config" -Method GET -Headers $headers -UseBasicParsing
            Write-Host "Web.config VERIFIED on server: $($check.StatusCode)"
          } catch { Write-Host "WARNING: Web.config NOT FOUND on server after deploy!" }
          Write-Host "Deployment complete!"
        env:
          AZURE_KUDU_USERNAME: ${{ secrets.AZURE_KUDU_USERNAME }}
          AZURE_KUDU_PASSWORD: ${{ secrets.AZURE_KUDU_PASSWORD }}