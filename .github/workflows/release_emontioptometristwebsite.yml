# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - EmontiOptometristWebsite

on:
  push:
    branches:
      - Release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      - name: Restore NuGet packages
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: nuget restore ..\Emonti-Optometrist-Website.sln

      - name: Build and publish to folder
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: |
          $pub = "$env:GITHUB_WORKSPACE\published"
          msbuild Emonti-Optometrist-Website.csproj /nologo /verbosity:m /t:Build /p:Configuration=Release /p:OutDir="$pub\bin\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          robocopy . $pub /S /IS /XF *.cs *.csproj *.user *.sln /XD obj packages Properties /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 4) { exit $LASTEXITCODE } else { $global:LASTEXITCODE = 0 }

      - name: Verify published output
        run: |
          if (-Not (Test-Path "$env:GITHUB_WORKSPACE\published")) {
            Write-Error "Published folder not found"
            Get-ChildItem "$env:GITHUB_WORKSPACE" | Select-Object Name
            exit 1
          }
          $files = Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\published"
          Write-Host "Published $($files.Count) files"
          $files | Select-Object -First 20 FullName
          if ($files.Count -eq 0) { exit 1 }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/**

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: publish
      
      - name: Deploy to Azure Web App via Kudu ZIP API
        shell: pwsh
        run: |
          $zipPath = "$env:RUNNER_TEMP\deploy.zip"
          $kuduUrl = "https://emontioptometristwebsite-g6gjdgc2hsf7ghht.scm.southafricanorth-01.azurewebsites.net/api/zipdeploy"
          $credentials = "$($env:AZURE_KUDU_USERNAME):$($env:AZURE_KUDU_PASSWORD)"
          $encodedCreds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -DestinationPath $zipPath -Force
          Write-Host "Deploying $((Get-Item $zipPath).Length) bytes..."
          $response = Invoke-WebRequest -Uri $kuduUrl -Method POST -InFile $zipPath -ContentType "multipart/form-data" -Headers @{Authorization = "Basic $encodedCreds"} -UseBasicParsing
          if ($response.StatusCode -eq 200 -or $response.StatusCode -eq 202) {
            Write-Host "Deployment successful!"
          } else {
            Write-Error "Deployment failed with status $($response.StatusCode)"
            exit 1
          }
        env:
          AZURE_KUDU_USERNAME: ${{ secrets.AZURE_KUDU_USERNAME }}
          AZURE_KUDU_PASSWORD: ${{ secrets.AZURE_KUDU_PASSWORD }}