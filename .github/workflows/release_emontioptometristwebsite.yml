# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP app to Azure Web App - EmontiOptometristWebsite

on:
  push:
    branches:
      - Release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      - name: Restore NuGet packages
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: nuget restore ..\Emonti-Optometrist-Website.sln

      - name: Build and publish with MSBuild
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: |
          $pub = "$env:GITHUB_WORKSPACE\published"
          msbuild Emonti-Optometrist-Website.csproj /nologo /verbosity:m /p:DeployOnBuild=true /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl="$pub" /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inspect published output
        run: |
          if (-Not (Test-Path "$env:GITHUB_WORKSPACE\published")) {
            Write-Error "Published folder not found"
            Get-ChildItem "$env:GITHUB_WORKSPACE" | Select-Object Name
            exit 1
          }
          $files = Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\published"
          Write-Host "Published $($files.Count) files"
          $files | Select-Object -First 30 FullName

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/**

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: publish
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EmontiOptometristWebsite'
          slot-name: 'Production'
          package: publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_AF073AC291564FBC91DBF4742BE8B3F2 }}