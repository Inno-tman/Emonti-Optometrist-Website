name: Build and deploy ASP app to Azure Web App - EmontiOptometristWebsite

on:
  push:
    branches:
      - Release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild path
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1.0.5

      - name: Restore NuGet packages
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: nuget restore ..\Emonti-Optometrist-Website.sln

      - name: Build and publish to folder
        working-directory: Emonti-Optometrist-Website/Emonti-Optometrist-Website
        run: |
          $pub = "$env:GITHUB_WORKSPACE\published"
          msbuild Emonti-Optometrist-Website.csproj /nologo /verbosity:m /t:Build /p:Configuration=Release /p:OutDir="$pub\bin\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          robocopy . $pub /S /IS /XF *.cs *.csproj *.user *.sln *.docx *.doc *.mdf *.ldf /XD obj packages Properties .vs App_Data bin /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 4) { exit $LASTEXITCODE } else { $global:LASTEXITCODE = 0 }
          $roslynSrc = Resolve-Path "..\packages\Microsoft.CodeDom.Providers.DotNetCompilerPlatform.2.0.1\tools\Roslyn45" -ErrorAction SilentlyContinue
          if ($roslynSrc) {
            $roslynDest = New-Item -ItemType Directory -Path "$pub\bin\roslyn" -Force
            Copy-Item -Path "$roslynSrc\*" -Destination $roslynDest -Recurse -Force
            Write-Host "Roslyn compiler copied"
          } else { Write-Host "WARNING: Roslyn source not found" }
          Remove-Item -Recurse -Force "$pub\bin\_PublishedWebsites" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$pub\bin\*.xml" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$pub\bin\*.pdb" -ErrorAction SilentlyContinue

      - name: Verify published output
        run: |
          if (-Not (Test-Path "$env:GITHUB_WORKSPACE\published")) { Write-Error "Published folder not found"; exit 1 }
          if (-Not (Test-Path "$env:GITHUB_WORKSPACE\published\Web.config")) { Write-Error "Web.config NOT FOUND"; exit 1 }
          $files = Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\published"
          Write-Host "Published $($files.Count) files, $([Math]::Round(($files | Measure-Object -Property Length -Sum).Sum/1MB, 2)) MB"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ASP-app
          path: published/**

  deploy:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: ASP-app
          path: C:\deploy\publish

      - name: Deploy via Kudu Zip Deploy API
        shell: pwsh
        run: |
          $scmUrl = "https://emontioptometristwebsite-g6gjdgc2hsf7ghht.scm.southafricanorth-01.azurewebsites.net"
          $credentials = "$($env:AZURE_KUDU_USERNAME):$($env:AZURE_KUDU_PASSWORD)"
          $encodedCreds = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($credentials))

          $publishPath = "C:\deploy\publish"
          $zipPath = "C:\deploy\deploy.zip"

          Write-Host "Files in publish folder:"
          Get-ChildItem $publishPath | Select-Object Name

          Compress-Archive -Path "$publishPath\*" -DestinationPath $zipPath -Force
          Write-Host "Zip size: $([Math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB"

          Write-Host "Deploying via zipdeploy API..."
          $deployHeaders = @{
            Authorization  = "Basic $encodedCreds"
            "Content-Type" = "application/zip"
          }
          $response = Invoke-WebRequest `
            -Uri "$scmUrl/api/zipdeploy?isAsync=true" `
            -Method POST `
            -Headers $deployHeaders `
            -InFile $zipPath `
            -UseBasicParsing

          Write-Host "Accepted: $($response.StatusCode)"

          # Poll until complete
          $statusUrl = "$scmUrl/api/deployments/latest"
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 10
            $status = Invoke-WebRequest -Uri $statusUrl -Headers @{Authorization = "Basic $encodedCreds"} -UseBasicParsing
            $json = $status.Content | ConvertFrom-Json
            Write-Host "[$i] Status: $($json.status) - $($json.status_text)"
            if ($json.status -eq 4) { Write-Host "Deployment SUCCESS"; break }
            if ($json.status -eq 3) { Write-Host "ERROR: Deployment FAILED"; exit 1 }
          }

          # Verify Web.config
          try {
            $check = Invoke-WebRequest -Uri "$scmUrl/api/vfs/site/wwwroot/Web.config" -Headers @{Authorization = "Basic $encodedCreds"} -UseBasicParsing
            Write-Host "Web.config verified on server: $($check.StatusCode)"
          } catch { Write-Host "WARNING: Web.config not found after deploy" }

          Write-Host "Deployment complete!"
        env:
          AZURE_KUDU_USERNAME: ${{ secrets.AZURE_KUDU_USERNAME }}
          AZURE_KUDU_PASSWORD: ${{ secrets.AZURE_KUDU_PASSWORD }}